<!doctype html>
<html lang="de">
  <head>
    <script>
      try { var m = localStorage.getItem("theme"); } catch (e) {}
      document.documentElement.classList.toggle("dark",
        m === "dark" || (m !== "light" && matchMedia("(prefers-color-scheme: dark)").matches));
      // Custom theme as generated by themes.ts last run, so the first paint already has its colors.
      try {
        var c = localStorage.getItem("themeCss");
        if (c) {
          var s = document.createElement("style");
          s.id = "user-theme";
          s.textContent = c;
          document.head.appendChild(s);
        }
      } catch (e) {}
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>L'Atelier de Claude</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
