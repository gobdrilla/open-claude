[package]
name = "ocui"
version = "1.4.6"
description = "Projekt-Launcher fuer Claude Code"
authors = ["Marlon Schmitz"]
edition = "2021"
default-run = "ocui"

[lib]
name = "ocui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
# Projektsuche im Editor (fs_search)
regex = "1"
portable-pty = "0.9"
# nur fuer die eigene Shell (src/bin/ocui-sh.rs)
reedline = "0.49"
ctrlc = "3"
# native-tls = SChannel: nutzt den Windows-Zertifikatsspeicher (Firmen-Root-CA hinter Proxy)
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls", "charset", "http2", "system-proxy"] }
base64 = "0.23.1"
# Vorschaubilder fuers Aktivitaets-Panel (nur die Formate, die claude einbettet)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
trash = "5.2.9"
tokio = { version = "1.53.2", features = ["net", "io-util", "sync", "macros", "rt"] }
# IDE-Protokoll von Claude Code (WebSocket-MCP) und MCP-Server der Session, src/ide.rs
tokio-tungstenite = "0.30"
getrandom = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# keyring ohne Plattform-Feature haelt den Token nur im RAM, darum je Ziel ein echter Speicher
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Secret Service (GNOME-Keyring/KWallet) ueberlebt Neustarts, keyutils allein nicht
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Tray nur, wenn AppIndicator ladbar ist und ein StatusNotifierWatcher laeuft (src/lib.rs, tray_supported)
libloading = "0.7"
gio = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# Thin statt volles LTO mit einer Codegen-Unit: der Schritt lief einkernig und war der Grossteil der Build-Zeit.
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
# mock_app fuer die Server-Tests in src/ide.rs
tauri = { version = "2", features = ["test"] }
